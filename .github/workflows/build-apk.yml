name: Build Ariel Movies APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zovex/flow app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='ArielMovies'
          include ':app'
          GRADLE
          printf 'android.useAndroidX=true\n' > gradle.properties
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zovex.flow'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.zovex.flow'
                  minSdk 26
                  targetSdk 35
                  versionCode 5
                  versionName '1.2.0'
              }
          }
          dependencies { implementation 'com.google.android.gms:play-services-cast-framework:22.0.0'; implementation 'androidx.browser:browser:1.8.0' }
          GRADLE
          curl -fsSL https://raw.githubusercontent.com/boherbatov/ariel-movies/main/logo.png -o app/src/main/res/drawable/app_icon.png
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <application android:name=".App" android:theme="@style/AppTheme" android:label="Ariel Movies 🍿" android:icon="@drawable/app_icon" android:usesCleartextTraffic="false" android:hardwareAccelerated="true" android:banner="@drawable/app_icon">
              <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" android:supportsPictureInPicture="true" android:resizeableActivity="true" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="arielmovies" android:host="auth"/>
                </intent-filter>
              </activity>
              <meta-data android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" android:value="com.zovex.flow.CastOptionsProvider"/>
            </application>
          </manifest>
          XML
          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#36D6AD</item>
              <item name="android:navigationBarColor">#071016</item>
              <item name="android:statusBarColor">#071016</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowActionModeOverlay">true</item>
            </style>
          </resources>
          XML
          cat > app/src/main/java/com/zovex/flow/App.java <<'JAVA'
          package com.zovex.flow;
          import android.app.Application;
          public class App extends Application {}
          JAVA
          cat > app/src/main/java/com/zovex/flow/CastOptionsProvider.java <<'JAVA'
          package com.zovex.flow;
          import android.content.Context;
          import com.google.android.gms.cast.framework.*;
          import com.google.android.gms.cast.CastMediaControlIntent;
          import java.util.*;
          public class CastOptionsProvider implements OptionsProvider {
            public CastOptions getCastOptions(Context c){return new CastOptions.Builder().setReceiverApplicationId(CastMediaControlIntent.DEFAULT_MEDIA_RECEIVER_APPLICATION_ID).build();}
            public List<SessionProvider> getAdditionalSessionProviders(Context c){return null;}
          }
          JAVA
          cat > app/src/main/java/com/zovex/flow/MainActivity.java <<'JAVA'
          package com.zovex.flow;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import android.content.pm.ActivityInfo;
          import android.util.Rational;
          import androidx.core.view.*;
          import android.webkit.JavascriptInterface;
          import com.google.android.gms.cast.*;
          import com.google.android.gms.cast.framework.*;
          import com.google.android.gms.cast.framework.media.*;
          import androidx.browser.customtabs.CustomTabsIntent;

          public class MainActivity extends Activity {
            private static final String HOME="https://ariel-movies.onrender.com/";
            private WebView web;
            private ValueCallback<Uri[]> fileCallback;
            private static final int FILE_CHOOSER=9001;
            @Override public void onCreate(Bundle b){super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(7,16,22)); getWindow().setNavigationBarColor(Color.rgb(7,16,22));
              web=new WebView(this); setContentView(web); ViewCompat.setOnApplyWindowInsetsListener(web,(v,in)->{androidx.core.graphics.Insets bars=in.getInsets(WindowInsetsCompat.Type.systemBars());v.setPadding(bars.left,bars.top,bars.right,bars.bottom);return in;}); WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setMediaPlaybackRequiresUserGesture(false);
              s.setLoadWithOverviewMode(true); s.setUseWideViewPort(true); s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
              s.setUserAgentString(s.getUserAgentString()+" ArielMoviesAndroid/5.0");
              CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
              web.addJavascriptInterface(new Object(){ @JavascriptInterface public void googleLogin(){runOnUiThread(()->new CustomTabsIntent.Builder().setShowTitle(false).build().launchUrl(MainActivity.this,Uri.parse(HOME+"auth-mobile")));} @JavascriptInterface public void cast(String url,String title,String mime){ runOnUiThread(()->{ try { CastSession cs=CastContext.getSharedInstance(MainActivity.this).getSessionManager().getCurrentCastSession(); if(cs==null||!cs.isConnected()){ Toast.makeText(MainActivity.this,"בחר מכשיר Cast דרך סמל השידור במערכת",Toast.LENGTH_LONG).show(); return;} MediaMetadata md=new MediaMetadata(MediaMetadata.MEDIA_TYPE_MOVIE);md.putString(MediaMetadata.KEY_TITLE,title);MediaInfo info=new MediaInfo.Builder(url).setStreamType(MediaInfo.STREAM_TYPE_BUFFERED).setContentType(mime==null||mime.isEmpty()?"video/mp4":mime).setMetadata(md).build();cs.getRemoteMediaClient().load(new MediaLoadRequestData.Builder().setMediaInfo(info).setAutoplay(true).build()); }catch(Exception e){Toast.makeText(MainActivity.this,"Cast אינו זמין במכשיר זה",Toast.LENGTH_SHORT).show();}}); }},"ArielNative");
              web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){
                Uri u=r.getUrl(); if("ariel-movies.onrender.com".equals(u.getHost())) return false;
                startActivity(new Intent(Intent.ACTION_VIEW,u)); return true; }});
              web.setWebChromeClient(new WebChromeClient(){
                @Override public void onShowCustomView(View view, CustomViewCallback cb){ setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE); setContentView(view); }
                @Override public void onHideCustomView(){ setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); setContentView(web); }
                @Override public boolean onShowFileChooser(WebView w,ValueCallback<Uri[]> cb,FileChooserParams p){ fileCallback=cb; try{startActivityForResult(p.createIntent(),FILE_CHOOSER);return true;}catch(Exception e){fileCallback=null;return false;} }
              });
              web.setDownloadListener((url,ua,cd,mime,len)->startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url))));
              if(b==null)web.loadUrl(HOME); else web.restoreState(b); handleAuth(getIntent());
            }
            private boolean videoPlaying(){ final boolean[] playing={false}; try { android.webkit.WebView.HitTestResult h=web.getHitTestResult(); web.evaluateJavascript("(()=>{const v=document.querySelector('#player:not(.hidden) video');return !!(v&&!v.paused&&!v.ended&&v.readyState>2)})()",r->playing[0]="true".equals(r)); return playing[0]; } catch(Exception e){return false;} }
            @Override public void onUserLeaveHint(){ super.onUserLeaveHint(); if(Build.VERSION.SDK_INT>=26&&!isInPictureInPictureMode()){ web.evaluateJavascript("(()=>{const v=document.querySelector('#player:not(.hidden) video');return !!(v&&!v.paused&&!v.ended&&v.readyState>2)})()",r->{if("true".equals(r)){try{enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16,9)).build());}catch(Exception ignored){}}}); } }
            @Override public void onPictureInPictureModeChanged(boolean inPip, android.content.res.Configuration c){super.onPictureInPictureModeChanged(inPip,c); web.evaluateJavascript("document.documentElement.classList.toggle('android-pip',"+inPip+");",null);}
            private void handleAuth(Intent i){if(i==null||i.getData()==null)return;Uri d=i.getData();if("arielmovies".equals(d.getScheme())&&"auth".equals(d.getHost())){String token=d.getQueryParameter("id_token");if(token!=null){String js="firebase.auth().signInWithCredential(firebase.auth.GoogleAuthProvider.credential("+org.json.JSONObject.quote(token)+")).then(()=>document.getElementById('authModal').classList.add('hidden')).catch(e=>alert(e.message))";web.post(()->web.evaluateJavascript(js,null));}}}
            @Override protected void onNewIntent(Intent i){super.onNewIntent(i);setIntent(i);handleAuth(i);}
            @Override protected void onSaveInstanceState(Bundle b){web.saveState(b);super.onSaveInstanceState(b);}
            @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
            @Override protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==FILE_CHOOSER&&fileCallback!=null){fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c,d));fileCallback=null;}}
          }
          JAVA
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Ariel-Movies.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ariel-Movies-APK
          path: Ariel-Movies.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ariel-movies-tv-cast-v5
          name: Ariel Movies 🍿 Android TV + Cast v5
          body: "אפליקציית Android ללא מסגרת דפדפן. התוכן נטען מהאתר החי, ולכן עדכוני האתר מופיעים בלי התקנה מחדש."
          files: Ariel-Movies.apk
