name: Build Ariel Movies APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zovex/flow app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='ArielMovies'
          include ':app'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zovex.flow'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.zovex.flow'
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName '1.1.0'
              }
          }
          GRADLE
          curl -fsSL https://raw.githubusercontent.com/boherbatov/ariel-movies/main/logo.png -o app/src/main/res/drawable/app_icon.png
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:theme="@style/AppTheme" android:label="Ariel Movies 🍿" android:icon="@drawable/app_icon" android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" android:supportsPictureInPicture="true" android:resizeableActivity="true" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML
          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#36D6AD</item>
              <item name="android:navigationBarColor">#071016</item>
              <item name="android:statusBarColor">#071016</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowActionModeOverlay">true</item>
            </style>
          </resources>
          XML
          cat > app/src/main/java/com/zovex/flow/MainActivity.java <<'JAVA'
          package com.zovex.flow;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import android.content.pm.ActivityInfo;
          import android.util.Rational;

          public class MainActivity extends Activity {
            private static final String HOME="https://ariel-movies.onrender.com/";
            private WebView web;
            private ValueCallback<Uri[]> fileCallback;
            private static final int FILE_CHOOSER=9001;
            @Override public void onCreate(Bundle b){super.onCreate(b);
              getWindow().setStatusBarColor(Color.rgb(7,16,22)); getWindow().setNavigationBarColor(Color.rgb(7,16,22));
              web=new WebView(this); setContentView(web); WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setMediaPlaybackRequiresUserGesture(false);
              s.setLoadWithOverviewMode(true); s.setUseWideViewPort(true); s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
              s.setUserAgentString(s.getUserAgentString()+" ArielMoviesAndroid/4.0");
              CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
              web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){
                Uri u=r.getUrl(); if("ariel-movies.onrender.com".equals(u.getHost())) return false;
                startActivity(new Intent(Intent.ACTION_VIEW,u)); return true; }});
              web.setWebChromeClient(new WebChromeClient(){
                @Override public void onShowCustomView(View view, CustomViewCallback cb){ setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE); setContentView(view); }
                @Override public void onHideCustomView(){ setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); setContentView(web); }
                @Override public boolean onShowFileChooser(WebView w,ValueCallback<Uri[]> cb,FileChooserParams p){ fileCallback=cb; try{startActivityForResult(p.createIntent(),FILE_CHOOSER);return true;}catch(Exception e){fileCallback=null;return false;} }
              });
              web.setDownloadListener((url,ua,cd,mime,len)->startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse(url))));
              if(b==null)web.loadUrl(HOME); else web.restoreState(b);
            }
            private boolean videoPlaying(){ try { String u=web.getUrl(); return u!=null; } catch(Exception e){return false;} }
            @Override public void onUserLeaveHint(){ super.onUserLeaveHint(); if(Build.VERSION.SDK_INT>=26 && videoPlaying() && !isInPictureInPictureMode()){ try{ enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16,9)).build()); }catch(Exception ignored){} } }
            @Override public void onPictureInPictureModeChanged(boolean inPip, android.content.res.Configuration c){super.onPictureInPictureModeChanged(inPip,c); web.evaluateJavascript("document.documentElement.classList.toggle('android-pip',"+inPip+");",null);}
            @Override protected void onSaveInstanceState(Bundle b){web.saveState(b);super.onSaveInstanceState(b);}
            @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
            @Override protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==FILE_CHOOSER&&fileCallback!=null){fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c,d));fileCallback=null;}}
          }
          JAVA
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Ariel-Movies.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ariel-Movies-APK
          path: Ariel-Movies.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ariel-movies-pip-v4
          name: Ariel Movies 🍿 Android PiP v4
          body: "אפליקציית Android ללא מסגרת דפדפן. התוכן נטען מהאתר החי, ולכן עדכוני האתר מופיעים בלי התקנה מחדש."
          files: Ariel-Movies.apk
