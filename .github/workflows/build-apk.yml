name: Build Ariel Movies APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zovex/flow app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='ArielMovies'
          include ':app'
          GRADLE
          printf 'android.useAndroidX=true\n' > gradle.properties
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zovex.flow'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.zovex.flow'
                  minSdk 26
                  targetSdk 35
                  versionCode 5
                  versionName '1.2.0'
              }
          }
          dependencies { implementation 'com.google.android.gms:play-services-cast-framework:22.0.0'; implementation 'androidx.browser:browser:1.8.0'; implementation 'androidx.mediarouter:mediarouter:1.7.0';  }
          GRADLE
          curl -fsSL https://raw.githubusercontent.com/boherbatov/ariel-movies/main/logo.png -o app/src/main/res/drawable/app_icon.png
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <application android:name=".App" android:theme="@style/AppTheme" android:label="Ariel Movies 🍿" android:icon="@drawable/app_icon" android:usesCleartextTraffic="false" android:hardwareAccelerated="true" android:banner="@drawable/app_icon">
              <activity android:name=".MainActivity" android:launchMode="singleTask" android:screenOrientation="unspecified" android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout" android:supportsPictureInPicture="true" android:resizeableActivity="true" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
                <intent-filter>
                  <action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/>
                  <data android:scheme="arielmovies" android:host="auth"/>
                </intent-filter>
              </activity>
              <meta-data android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME" android:value="com.zovex.flow.CastOptionsProvider"/>
            </application>
          </manifest>
          XML
          cat > app/src/main/res/values/styles.xml <<'XML'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#36D6AD</item>
              <item name="android:navigationBarColor">#071016</item>
              <item name="android:statusBarColor">#071016</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowActionModeOverlay">true</item>
            </style>
          </resources>
          XML
          cat > app/src/main/java/com/zovex/flow/App.java <<'JAVA'
          package com.zovex.flow;
          import android.app.Application;
          public class App extends Application {}
          JAVA
          cat > app/src/main/java/com/zovex/flow/CastOptionsProvider.java <<'JAVA'
          package com.zovex.flow;
          import android.content.Context;
          import com.google.android.gms.cast.framework.*;
          import com.google.android.gms.cast.CastMediaControlIntent;
          import java.util.*;
          public class CastOptionsProvider implements OptionsProvider {
            public CastOptions getCastOptions(Context c){return new CastOptions.Builder().setReceiverApplicationId("CC1AD845").build();}
            public List<SessionProvider> getAdditionalSessionProviders(Context c){return null;}
          }
          JAVA
          cat > app/src/main/java/com/zovex/flow/MainActivity.java <<'JAVA'
          package com.zovex.flow;
          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.provider.Settings;
          import android.view.*;
          import android.webkit.*;
          import android.widget.*;
          import android.content.pm.ActivityInfo;
          import android.util.Rational;
          import androidx.core.view.*;
          import android.webkit.JavascriptInterface;
          import com.google.android.gms.cast.*;
          import com.google.android.gms.cast.framework.*;
          import com.google.android.gms.cast.framework.media.*;
          import androidx.browser.customtabs.CustomTabsIntent;
          import androidx.mediarouter.app.MediaRouteButton;
          import androidx.mediarouter.media.MediaRouteSelector;

          public class MainActivity extends Activity {
            private static final String HOME="https://ariel-movies.onrender.com/";
            private WebView web;
            private ValueCallback<Uri[]> fileCallback;
            private static final int FILE_CHOOSER=9001;
            private String pendingCastUrl,pendingCastTitle,pendingCastMime,pendingAuthToken;
            private MediaRouteButton castRouteButton;
            private boolean mediaPlaying=false;
            @Override public void onCreate(Bundle b){super.onCreate(b);
              WindowCompat.setDecorFitsSystemWindows(getWindow(),false); getWindow().setStatusBarColor(Color.rgb(7,16,22)); getWindow().setNavigationBarColor(Color.rgb(7,16,22)); if(Build.VERSION.SDK_INT>=29)getWindow().setNavigationBarContrastEnforced(false); if(Build.VERSION.SDK_INT>=23)getWindow().getDecorView().setSystemUiVisibility(0);
              web=new WebView(this); android.widget.FrameLayout root=new android.widget.FrameLayout(this);root.addView(web,new android.widget.FrameLayout.LayoutParams(-1,-1));setContentView(root);ViewCompat.setOnApplyWindowInsetsListener(root,(v,in)->{androidx.core.graphics.Insets bars=in.getInsets(WindowInsetsCompat.Type.statusBars()|WindowInsetsCompat.Type.navigationBars()|WindowInsetsCompat.Type.displayCutout());android.widget.FrameLayout.LayoutParams lp=(android.widget.FrameLayout.LayoutParams)web.getLayoutParams();lp.leftMargin=bars.left;lp.topMargin=bars.top;lp.rightMargin=bars.right;lp.bottomMargin=bars.bottom;web.setLayoutParams(lp);return WindowInsetsCompat.CONSUMED;});ViewCompat.requestApplyInsets(root); WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setMediaPlaybackRequiresUserGesture(false);
              s.setLoadWithOverviewMode(true); s.setUseWideViewPort(true); s.setBuiltInZoomControls(false); s.setDisplayZoomControls(false);
              s.setUserAgentString(s.getUserAgentString()+" ArielMoviesAndroid/5.0");
              CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
              web.addJavascriptInterface(new Object(){ @JavascriptInterface public void googleLogin(){runOnUiThread(()->new CustomTabsIntent.Builder().setShowTitle(false).build().launchUrl(MainActivity.this,Uri.parse(HOME+"auth-mobile")));} @JavascriptInterface public void share(String title,String text,String url){runOnUiThread(()->{Intent send=new Intent(Intent.ACTION_SEND);send.setType("text/plain");send.putExtra(Intent.EXTRA_SUBJECT,title);send.putExtra(Intent.EXTRA_TEXT,text+"\n"+url);startActivity(Intent.createChooser(send,"שיתוף באמצעות"));});} @JavascriptInterface public void cast(String url,String title,String mime){runOnUiThread(()->{startCast(url,title,mime);});} @JavascriptInterface public void setPlaying(boolean p){runOnUiThread(()->{mediaPlaying=p;updatePipParams();});}},"ArielNative");
              web.setWebViewClient(new WebViewClient(){@Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r){
                Uri u=r.getUrl(); if("ariel-movies.onrender.com".equals(u.getHost())) return false;
                if("arielmovies".equals(u.getScheme())){handleAuth(new Intent(Intent.ACTION_VIEW,u));return true;} startActivity(new Intent(Intent.ACTION_VIEW,u)); return true; } @Override public void onPageFinished(WebView v,String url){super.onPageFinished(v,url);applyPendingAuth();}});
              web.setWebChromeClient(new WebChromeClient(){
                @Override public void onShowCustomView(View view, CustomViewCallback cb){ setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE); setContentView(view); }
                @Override public void onHideCustomView(){ setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED); setContentView(web); }
                @Override public boolean onShowFileChooser(WebView w,ValueCallback<Uri[]> cb,FileChooserParams p){ fileCallback=cb; try{startActivityForResult(p.createIntent(),FILE_CHOOSER);return true;}catch(Exception e){fileCallback=null;return false;} }
              });
                            if(b==null)web.loadUrl(HOME); else web.restoreState(b); handleAuth(getIntent());
            }
            private void startCast(String url,String title,String mime){try{pendingCastUrl=url;pendingCastTitle=title;pendingCastMime=mime;CastContext cc=CastContext.getSharedInstance(this);CastSession cs=cc.getSessionManager().getCurrentCastSession();if(cs!=null&&cs.isConnected()){sendPendingCast(cs);return;}if(castRouteButton==null){castRouteButton=new MediaRouteButton(this);android.widget.FrameLayout root=(android.widget.FrameLayout)web.getParent();android.widget.FrameLayout.LayoutParams crp=new android.widget.FrameLayout.LayoutParams(96,96);crp.gravity=android.view.Gravity.TOP|android.view.Gravity.END;castRouteButton.setBackgroundColor(android.graphics.Color.TRANSPARENT);root.addView(castRouteButton,crp);CastButtonFactory.setUpMediaRouteButton(this,castRouteButton);cc.getSessionManager().addSessionManagerListener(new SessionManagerListener<CastSession>(){public void onSessionStarted(CastSession x,String id){sendPendingCast(x);} public void onSessionResumed(CastSession x,boolean b){sendPendingCast(x);} public void onSessionStarting(CastSession x){} public void onSessionStartFailed(CastSession x,int e){} public void onSessionEnding(CastSession x){} public void onSessionEnded(CastSession x,int e){} public void onSessionResuming(CastSession x,String id){} public void onSessionResumeFailed(CastSession x,int e){} public void onSessionSuspended(CastSession x,int e){}},CastSession.class);} castRouteButton.bringToFront();boolean clicked=castRouteButton.performClick();if(!clicked)Toast.makeText(this,"Cast: פתיחת הבוחר נכשלה",Toast.LENGTH_LONG).show();}catch(Throwable e){Toast.makeText(this,"Cast אינו זמין: "+e.getClass().getSimpleName()+" "+String.valueOf(e.getMessage()),Toast.LENGTH_LONG).show();}}
            private void sendPendingCast(CastSession cs){if(pendingCastUrl==null||cs==null||!cs.isConnected())return;MediaMetadata md=new MediaMetadata(MediaMetadata.MEDIA_TYPE_MOVIE);md.putString(MediaMetadata.KEY_TITLE,pendingCastTitle);MediaInfo info=new MediaInfo.Builder(pendingCastUrl).setStreamType(MediaInfo.STREAM_TYPE_BUFFERED).setContentType(pendingCastMime==null||pendingCastMime.isEmpty()?"video/mp4":pendingCastMime).setMetadata(md).build();cs.getRemoteMediaClient().load(new MediaLoadRequestData.Builder().setMediaInfo(info).setAutoplay(true).build());pendingCastUrl=null;}
            private boolean videoPlaying(){ final boolean[] playing={false}; try { android.webkit.WebView.HitTestResult h=web.getHitTestResult(); web.evaluateJavascript("(()=>{const v=document.querySelector('#player:not(.hidden) video');return !!(v&&!v.paused&&!v.ended&&v.readyState>2)})()",r->playing[0]="true".equals(r)); return playing[0]; } catch(Exception e){return false;} }
            private void updatePipParams(){if(Build.VERSION.SDK_INT>=26){try{PictureInPictureParams.Builder b=new PictureInPictureParams.Builder().setAspectRatio(new Rational(16,9));if(Build.VERSION.SDK_INT>=31)b.setAutoEnterEnabled(mediaPlaying);setPictureInPictureParams(b.build());}catch(Exception ignored){}}}
            @Override public void onUserLeaveHint(){super.onUserLeaveHint();if(Build.VERSION.SDK_INT>=26&&Build.VERSION.SDK_INT<31&&mediaPlaying&&!isInPictureInPictureMode()){try{enterPictureInPictureMode(new PictureInPictureParams.Builder().setAspectRatio(new Rational(16,9)).build());}catch(Exception ignored){}}}
            @Override public void onPictureInPictureModeChanged(boolean inPip, android.content.res.Configuration c){super.onPictureInPictureModeChanged(inPip,c); web.evaluateJavascript("document.documentElement.classList.toggle('android-pip',"+inPip+");",null);}
            private void handleAuth(Intent i){if(i==null||i.getData()==null)return;Uri d=i.getData();if("arielmovies".equals(d.getScheme())&&"auth".equals(d.getHost())){pendingAuthToken=d.getQueryParameter("id_token");applyPendingAuth();}} private void applyPendingAuth(){if(pendingAuthToken==null||web==null)return;String token=pendingAuthToken;String js="(()=>{if(!window.firebase||!firebase.auth)return false;firebase.auth().signInWithCredential(firebase.auth.GoogleAuthProvider.credential("+org.json.JSONObject.quote(token)+")).then(()=>{document.getElementById('authModal')?.classList.add('hidden');location.reload()}).catch(e=>alert(e.message));return true})()";web.post(()->web.evaluateJavascript(js,r->{if("true".equals(r))pendingAuthToken=null;}));}
            @Override protected void onNewIntent(Intent i){super.onNewIntent(i);setIntent(i);handleAuth(i);}
            @Override protected void onSaveInstanceState(Bundle b){web.saveState(b);super.onSaveInstanceState(b);}
            @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
            @Override protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==FILE_CHOOSER&&fileCallback!=null){fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c,d));fileCallback=null;}}
          }
          JAVA
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Ariel-Movies.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ariel-Movies-APK
          path: Ariel-Movies.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ariel-movies-tv-cast-v5
          name: Ariel Movies 🍿 Android TV + Cast v5
          body: "אפליקציית Android ללא מסגרת דפדפן. התוכן נטען מהאתר החי, ולכן עדכוני האתר מופיעים בלי התקנה מחדש."
          files: Ariel-Movies.apk
