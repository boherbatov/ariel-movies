name: Build Ariel Studio Admin APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-admin-apk.yml']
permissions:
  contents: write
jobs:
  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Create admin Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/zovex/flow/admin app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='ArielStudioAdmin'; include ':app'
          G
          printf 'android.useAndroidX=true\n' > gradle.properties
          cat > build.gradle <<'G'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          G
          cat > app/build.gradle <<'G'
          plugins { id 'com.android.application' }
          android { namespace 'com.zovex.flow.admin'; compileSdk 35
            defaultConfig { applicationId 'com.zovex.flow.admin'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
          }
          G
          cp admin-app-icon.png app/src/main/res/drawable/app_icon.png
          cat > app/src/main/res/values/styles.xml <<'X'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#45E1B4</item><item name="android:navigationBarColor">#050C12</item><item name="android:statusBarColor">#050C12</item><item name="android:windowLightStatusBar">false</item></style></resources>
          X
          cat > app/src/main/AndroidManifest.xml <<'X'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="Ariel Studio" android:icon="@drawable/app_icon" android:usesCleartextTraffic="false" android:hardwareAccelerated="true"><activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          X
          cat > app/src/main/java/com/zovex/flow/admin/MainActivity.java <<'J'
          package com.zovex.flow.admin;
          import android.app.*;import android.os.*;import android.graphics.Color;import android.net.Uri;import android.content.*;import android.webkit.*;import android.widget.*;
          public class MainActivity extends Activity {WebView web;ValueCallback<Uri[]> files;static final int PICK=42;public void onCreate(Bundle b){super.onCreate(b);getWindow().setStatusBarColor(Color.rgb(5,12,18));getWindow().setNavigationBarColor(Color.rgb(5,12,18));web=new WebView(this);setContentView(web);WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setDatabaseEnabled(true);s.setUserAgentString(s.getUserAgentString()+" ArielStudioAdmin/1.0");CookieManager.getInstance().setAcceptCookie(true);web.setWebViewClient(new WebViewClient(){public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){Uri u=r.getUrl();if("ariel-movies.onrender.com".equals(u.getHost()))return false;startActivity(new Intent(Intent.ACTION_VIEW,u));return true;}});web.setWebChromeClient(new WebChromeClient(){public boolean onShowFileChooser(WebView w,ValueCallback<Uri[]> c,FileChooserParams p){files=c;try{startActivityForResult(p.createIntent(),PICK);return true;}catch(Exception e){files=null;return false;}}});if(b==null)web.loadUrl("https://ariel-movies.onrender.com/admin");else web.restoreState(b);}protected void onSaveInstanceState(Bundle b){web.saveState(b);super.onSaveInstanceState(b);}public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==PICK&&files!=null){files.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c,d));files=null;}}}
          J
      - run: gradle --no-daemon :app:assembleDebug && cp app/build/outputs/apk/debug/app-debug.apk Ariel-Studio-Admin.apk
      - uses: actions/upload-artifact@v4
        with: {name: Ariel-Studio-Admin-APK, path: Ariel-Studio-Admin.apk}
      - uses: softprops/action-gh-release@v2
        with: {tag_name: ariel-studio-admin-v1, name: 'Ariel Studio Admin Android v1', files: Ariel-Studio-Admin.apk}
