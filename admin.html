<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ariel Movies 🍿 · ניהול</title><style>
:root{--bg:#071016;--p:#10212b;--p2:#172e3a;--t:#f7fbfd;--m:#91a6b1;--a:#36d6ad;--r:#ff6675;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:24px}.head{display:flex;align-items:center;justify-content:space-between}.logo{color:var(--a)}.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0}.login{max-width:430px;margin:12vh auto}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select,.search{width:100%;background:#07141b;color:white;border:1px solid var(--line);border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--a);color:#032018;font-weight:800}.ghost{background:var(--p2);color:white}.danger{background:var(--r);color:white}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar>*{flex:1}.grid{display:grid;gap:10px}.row{display:flex;align-items:center;gap:12px;padding:10px;background:var(--p2);border-radius:12px}.row img{width:44px;height:62px;object-fit:cover;border-radius:8px}.row .copy{min-width:0;flex:1}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{color:var(--m)}dialog{width:min(92vw,700px);border:1px solid var(--line);border-radius:18px;background:var(--p);color:white}dialog::backdrop{background:#000b}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hide{display:none!important}.note{color:var(--m);font-size:13px}.status{color:var(--a)}@media(max-width:620px){.wrap{padding:14px}.cols{grid-template-columns:1fr}.row{align-items:flex-start}.row .actions{display:grid;gap:5px}.row button{padding:8px}}
</style></head><body><main class="wrap"><header class="head"><h1><span class="logo">▶</span> Ariel Movies 🍿 ניהול</h1><a href="/" style="color:var(--a)">לאתר</a></header>
<section id="login" class="card login"><h2>כניסת מנהל</h2><p class="note">הסיסמה נבדקת בשרת ואינה נשמרת בדפדפן.</p><form id="loginForm"><label class="field">סיסמה<input id="password" type="password" autocomplete="current-password" required></label><button class="btn" style="width:100%">כניסה</button><p id="loginError" style="color:var(--r)"></p></form></section>
<section id="app" class="hide"><div class="card"><div class="bar"><input id="q" class="search" placeholder="חיפוש סרט, סדרה או קטגוריה"><button id="searchBtn" class="btn ghost">חיפוש</button><button id="addBtn" class="btn">+ פריט חדש</button></div><p id="storage" class="note"></p></div><div id="list" class="grid"></div></section></main>
<dialog id="editor"><form id="editForm" method="dialog"><h2 id="editTitle">עריכת פריט</h2><input id="id" type="hidden"><div class="cols"><label class="field">שם<input id="title" required></label><label class="field">קטגוריה<input id="category"></label><label class="field">שנה<input id="year" type="number"></label><label class="field">שם סדרה<input id="series_name"></label><label class="field">עונה<input id="season_number" type="number"></label><label class="field">פרק<input id="episode_number" type="number"></label></div><label class="field">תיאור<textarea id="description" rows="4"></textarea></label><label class="field">כתובת פוסטר<input id="thumbnail_url" dir="ltr"></label><label class="field">כתובת וידאו<input id="video_url" dir="ltr"></label><div class="bar"><button type="button" id="cancel" class="btn ghost">ביטול</button><button class="btn">שמירה</button></div></form></dialog>
<script>
let csrf='',items=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o={}){o.headers={'content-type':'application/json',...(csrf?{'x-zf-csrf':csrf}:{}),...(o.headers||{})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'שגיאה');return d}async function status(){try{let d=await api('/api/admin/status');csrf=d.csrf;$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#storage').textContent=d.storage==='github'?'השינויים נשמרים ב-GitHub: '+d.repo:'אזהרה: אחסון מקומי בלבד';load()}catch{}}async function load(){let d=await api('/api/admin/items?q='+encodeURIComponent($('#q').value));items=d.items;$('#list').innerHTML=items.map((x,i)=>`<div class="row">${x.thumbnail_url?`<img src="${esc(x.thumbnail_url)}">`:''}<div class="copy"><b>${esc(x.series_name||x.title)}</b><small>${esc([x.category,x.year,x.series_name&&`עונה ${x.season_number||1} פרק ${x.episode_number||''}`].filter(Boolean).join(' · '))}</small></div><div class="actions"><button class="btn ghost" data-edit="${i}">עריכה</button><button class="btn danger" data-del="${esc(x.id)}">מחיקה</button></div></div>`).join('')||'<div class="card note">אין תוצאות</div>'}function open(x={}){for(const k of ['id','title','category','year','series_name','season_number','episode_number','description','thumbnail_url','video_url'])$('#'+k).value=x[k]??'';$('#editor').showModal()}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});csrf=d.csrf;status()}catch(x){$('#loginError').textContent=x.message}};$('#searchBtn').onclick=load;$('#q').onkeydown=e=>{if(e.key==='Enter')load()};$('#addBtn').onclick=()=>open();$('#cancel').onclick=()=>$('#editor').close();$('#list').onclick=async e=>{let b=e.target.closest('[data-edit],[data-del]');if(!b)return;if(b.dataset.edit!=null)return open(items[+b.dataset.edit]);if(confirm('למחוק את הפריט?')){await api('/api/admin/item',{method:'DELETE',body:JSON.stringify({id:b.dataset.del})});load()}};$('#editForm').onsubmit=async e=>{e.preventDefault();let item={};for(const k of ['id','title','category','year','series_name','season_number','episode_number','description','thumbnail_url','video_url']){let v=$('#'+k).value;if(['year','season_number','episode_number'].includes(k))v=v?+v:null;item[k]=v||null}await api('/api/admin/item',{method:'POST',body:JSON.stringify({item})});$('#editor').close();load()};status();
</script></body></html>
