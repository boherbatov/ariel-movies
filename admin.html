<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ariel Movies · Studio</title><style>
:root{--bg:#071016;--side:#09151d;--card:#10222d;--card2:#162e3a;--text:#f5fbfd;--muted:#8fa7b3;--a:#36d6ad;--red:#ff6172;--line:#ffffff16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--side);border-left:1px solid var(--line);padding:20px 13px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px}.brand img{width:42px;height:42px;border-radius:10px;background:white}.brand b{font-size:17px}.brand small{display:block;color:var(--a)}.nav{display:grid;gap:6px}.nav button{border:0;text-align:right;padding:12px;border-radius:10px;background:transparent;color:#c7d5db}.nav button.active,.nav button:hover{background:var(--card2);color:var(--a)}.main{padding:24px;max-width:1500px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0}.status{color:var(--a)}.cards{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px;margin:20px 0}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.metric b{font-size:28px;display:block;margin-top:6px}.muted{color:var(--muted)}.view{display:none}.view.active{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar>*{min-height:40px}.input,select,textarea{background:#071820;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px}.input{flex:1;min-width:180px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--a);color:#032019;font-weight:800}.ghost{background:var(--card2);color:white}.danger{background:var(--red);color:white}.table{overflow:auto;border:1px solid var(--line);border-radius:14px}.row{display:grid;grid-template-columns:32px 50px 2fr 1fr 90px 190px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card)}.row:hover{background:var(--card2)}.row img{width:40px;height:56px;object-fit:cover;border-radius:6px}.actions{display:flex;gap:5px}.actions button{padding:7px}.chart{display:flex;align-items:end;gap:7px;height:180px;padding-top:20px}.chart div{flex:1;background:linear-gradient(var(--a),#178467);border-radius:7px 7px 0 0;min-width:18px;position:relative}.chart small{position:absolute;bottom:-34px;right:50%;transform:translateX(50%) rotate(-35deg);white-space:nowrap;font-size:9px}.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.asset{background:var(--card2);border-radius:12px;padding:12px;overflow:hidden}.asset img{width:100%;height:100px;object-fit:cover;border-radius:8px}.password-wrap{position:relative;display:block}.password-wrap input{width:100%;padding-left:48px}.password-eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px}
.login{max-width:420px;margin:12vh auto}.field{display:grid;gap:6px;margin:10px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog{width:min(94vw,760px);background:var(--card);color:white;border:1px solid var(--line);border-radius:18px}dialog::backdrop{background:#000b}.drop{border:2px dashed #36d6ad66;border-radius:16px;padding:35px;text-align:center}.checklist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.checklist label{background:var(--card2);padding:10px;border-radius:9px}body.light{--bg:#f1f5f7;--side:#fff;--card:#fff;--card2:#e6eef1;--text:#14232b;--muted:#62737b;--line:#07101620}@media(max-width:850px){.shell{display:block}.side{position:relative;width:100%;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.main{padding:13px}.row{grid-template-columns:30px 45px 2fr 1fr 150px}.row>:nth-child(5){display:none}.cols{grid-template-columns:1fr}}
</style></head><body><section id="login" class="login panel"><h1>🎬 Ariel Studio</h1><p class="muted">מערכת ניהול מאובטחת</p><form id="loginForm"><label class="field">סיסמה<span class="password-wrap"><input class="input" id="password" type="password" required><button type="button" class="password-eye" aria-label="הצג סיסמה">👁</button></span></label><button class="btn" style="width:100%">כניסה</button><p id="loginError" style="color:var(--red)"></p></form></section>
<div id="studio" class="shell hide"><aside class="side"><div class="brand"><img src="/logo.png"><div><b>Ariel Studio</b><small>CONTROL CENTER</small></div></div><nav class="nav"><button data-view="dash" class="active">▦ לוח בקרה</button><button data-view="catalog">▶ קטלוג</button><button data-view="assets">▧ קבצים ותיקיות</button><button data-view="contacts">✉ פניות</button><button data-view="quality">✓ בקרת איכות</button><button data-view="settings">⚙ הגדרות</button><a href="/" style="color:var(--a);padding:12px">↗ צפייה באתר</a></nav></aside><main class="main"><header class="top"><div><h1 id="viewTitle">לוח בקרה</h1><span id="storage" class="status"></span></div></header>
<section id="dash" class="view active"><div id="metrics" class="cards"></div><div class="cols"><div class="panel"><h2>התפלגות קטגוריות</h2><div id="chart" class="chart"></div></div><div class="panel"><h2>פעולות מהירות</h2><div class="checklist"><button class="btn ghost" data-go="catalog">חיפוש מתקדם</button><button class="btn ghost" id="exportAll">ייצוא JSON</button><button class="btn ghost" id="importBtn">ייבוא JSON</button><button class="btn ghost" data-go="quality">בדיקת איכות</button><button class="btn ghost" data-go="assets">העלאת קובץ</button><button class="btn ghost" data-go="contacts">פניות חדשות</button></div><input id="importFile" type="file" accept="application/json" class="hide"></div></div></section>
<section id="catalog" class="view"><div class="toolbar"><button id="add" class="btn">＋ פריט חדש</button><input id="q" class="input" placeholder="חיפוש שם, סדרה או קטגוריה"><select id="cat"><option value="">כל הקטגוריות</option></select><select id="sort"><option value="title">מיון שם</option><option value="year">מיון שנה</option><option value="category">מיון קטגוריה</option></select><button id="search" class="btn ghost">חיפוש</button></div><div class="toolbar"><button id="selectAll" class="btn ghost">בחירת הכל</button><button id="duplicate" class="btn ghost">שכפול</button><button id="bulkCat" class="btn ghost">שינוי קטגוריה</button><button id="bulkDelete" class="btn danger">מחיקה מרובה</button><button id="csv" class="btn ghost">ייצוא CSV</button></div><div id="list" class="table"></div></section>
<section id="assets" class="view"><div class="cols"><div class="panel"><h2>תיקיות</h2><div class="toolbar"><input id="folderName" class="input" placeholder="שם תיקייה"><button id="newFolder" class="btn">＋ תיקייה</button></div><div id="folders" class="checklist"></div></div><div class="panel"><h2>העלאת קבצים</h2><label class="drop">גרור או בחר קובץ עד 1MB<input id="assetFile" type="file" hidden></label><select id="assetFolder"><option value="">ללא תיקייה</option></select></div></div><h2>ספריית קבצים</h2><div id="assetsGrid" class="asset-grid"></div></section>
<section id="contacts" class="view"><div class="toolbar"><button id="loadContacts" class="btn">רענון</button><button id="exportContacts" class="btn ghost">ייצוא פניות</button></div><div id="contactList" class="table"></div></section>
<section id="quality" class="view"><div id="qualityCards" class="cards"></div><div class="panel"><h2>כלי בדיקה</h2><div class="checklist"><button class="btn ghost" id="missingVideo">ללא וידאו</button><button class="btn ghost" id="missingPoster">ללא פוסטר</button><button class="btn ghost" id="badYear">שנה לא תקינה</button><button class="btn ghost" id="duplicateTitles">כותרות כפולות</button><button class="btn ghost" id="checkLinks">בדיקת קישורים</button><button class="btn ghost" id="clearFilters">ניקוי מסננים</button></div></div></section>
<section id="settings" class="view"><div class="panel"><h2>הגדרות אתר</h2><div class="cols"><label class="field">כותרת אתר<input id="siteTitle" class="input" value="Ariel Movies 🍿"></label><label class="field">שפת ברירת מחדל<select id="defaultLang"><option>עברית</option><option>English</option><option>العربية</option></select></label><label class="field">צבע דגש<input id="accent" type="color" value="#36d6ad"></label><label class="field">מספר פריטים בשורה<input id="rowSize" type="number" value="24"></label></div><div class="checklist"><label><input id="autoplay" type="checkbox" checked> ניגון אוטומטי</label><label><input id="registration" type="checkbox" checked> הרשמה פעילה</label><label><input id="maintenance" type="checkbox"> מצב תחזוקה</label></div><button id="saveSettings" class="btn" style="margin-top:14px">שמירת הגדרות</button></div></section></main></div>
<dialog id="editor"><form id="editForm"><h2>עריכת פריט</h2><input id="id" type="hidden"><div class="cols"><label class="field">שם<input id="title" class="input" required></label><label class="field">קטגוריה<input id="category" class="input"></label><label class="field">שנה<input id="year" class="input" type="number"></label><label class="field">סוג<select id="type"><option>direct</option><option>drive</option><option>youtube</option><option>kaltura</option></select></label><label class="field">שם סדרה<input id="series_name" class="input"></label><label class="field">עונה<input id="season_number" class="input" type="number"></label><label class="field">פרק<input id="episode_number" class="input" type="number"></label><label class="field">TMDB ID<input id="tmdb_id" class="input"></label></div><label class="field">תיאור<textarea id="description"></textarea></label><label class="field">פוסטר<input id="thumbnail_url" class="input" dir="ltr"></label><label class="field">וידאו<input id="video_url" class="input" dir="ltr"></label><div class="toolbar"><button type="button" id="preview" class="btn ghost">תצוגה מקדימה</button><button type="button" id="cancel" class="btn ghost">ביטול</button><button class="btn">שמירה</button></div></form></dialog>
<script>
let csrf='',items=[],dash={},selected=new Set();const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o={}){o.headers={'content-type':'application/json',...(csrf?{'x-zf-csrf':csrf}:{}),...(o.headers||{})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'שגיאה');return d}function download(name,text,type='application/json'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}async function boot(){try{let s=await api('/api/admin/status');csrf=s.csrf;$('#login').classList.add('hide');$('#studio').classList.remove('hide');$('#storage').textContent=s.storage==='github'?'● GitHub מחובר':'● אחסון מקומי';await refresh()}catch{}}async function refresh(){dash=await api('/api/admin/dashboard');$('#metrics').innerHTML=[['סה״כ פריטים',dash.total],['סרטים',dash.movies],['פרקים',dash.episodes],['מותאמים אישית',dash.custom],['פניות',dash.contacts]].map(x=>`<div class=metric><span class=muted>${x[0]}</span><b>${x[1].toLocaleString('he-IL')}</b></div>`).join('');let max=Math.max(...dash.categories.map(x=>x[1]));$('#chart').innerHTML=dash.categories.slice(0,12).map(x=>`<div style="height:${x[1]/max*100}%"><small>${esc(x[0])}</small></div>`).join('');$('#qualityCards').innerHTML=`<div class=metric><span>ללא וידאו</span><b>${dash.missingVideo}</b></div><div class=metric><span>ללא פוסטר</span><b>${dash.missingPoster}</b></div><div class=metric><span>מחוקים</span><b>${dash.deleted}</b></div>`;renderAssets();if(dash.settings){if($('#maintenance'))$('#maintenance').checked=!!dash.settings.maintenance;if($('#registration'))$('#registration').checked=dash.settings.registration!==false;if($('#autoplay'))$('#autoplay').checked=dash.settings.autoplay!==false}load()}async function load(){let d=await api('/api/admin/items?q='+encodeURIComponent($('#q')?.value||''));items=d.items;let cats=[...new Set(items.map(x=>x.category).filter(Boolean))];if($('#cat'))$('#cat').innerHTML='<option value="">כל הקטגוריות</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');renderList()}function filtered(){let a=items.filter(x=>!$('#cat').value||x.category===$('#cat').value),k=$('#sort').value;return a.sort((x,y)=>String(x[k]||'').localeCompare(String(y[k]||''),'he'))}function renderList(a=filtered()){ $('#list').innerHTML=a.map((x,i)=>`<div class=row><input type=checkbox data-check="${esc(x.id)}" ${selected.has(x.id)?'checked':''}>${x.thumbnail_url?`<img src="${esc(x.thumbnail_url)}">`:'<span>🎬</span>'}<div><b>${esc(x.series_name||x.title)}</b><small class=muted>${esc(x.title||'')}</small></div><span>${esc(x.category||'—')}</span><span>${esc(x.year||'—')}</span><div class=actions><button class="btn ghost" data-preview="${i}">צפייה</button><button class="btn ghost" data-edit="${i}">עריכה</button><button class="btn danger" data-del="${esc(x.id)}">מחיקה</button></div></div>`).join('')||'<div class=panel>אין תוצאות</div>'}function open(x={}){for(const k of ['id','title','category','year','type','series_name','season_number','episode_number','tmdb_id','description','thumbnail_url','video_url'])$('#'+k).value=x[k]??'';$('#editor').showModal()}function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#viewTitle').textContent=document.querySelector(`[data-view="${v}"]`)?.textContent.trim()||v;if(v==='contacts')loadContacts()}async function renderAssets(){let folders=dash.folders||[],assets=dash.assets||[];$('#folders').innerHTML=folders.map(x=>`<label>📁 ${esc(x)} <button class="btn danger" data-folder-del="${esc(x)}">מחיקה</button></label>`).join('')||'<span class=muted>אין תיקיות</span>';$('#assetFolder').innerHTML='<option value="">ללא תיקייה</option>'+folders.map(x=>`<option>${esc(x)}</option>`).join('');$('#assetsGrid').innerHTML=assets.map(x=>`<div class=asset>${x.data.startsWith('data:image')?`<img src="${x.data}">`:'<div style="font-size:45px">📄</div>'}<b>${esc(x.name)}</b><small class=muted>${esc(x.folder||'ללא תיקייה')}</small><div class=toolbar><a class="btn ghost" href="/asset/${x.id}" download>הורדה</a><button class="btn ghost" data-copy="${x.id}">קישור</button><button class="btn danger" data-asset-del="${x.id}">מחיקה</button></div></div>`).join('')||'<span class=muted>אין קבצים</span>'}async function loadContacts(){let d=await api('/api/admin/contacts');$('#contactList').innerHTML=d.contacts.map(x=>`<div class=row style="grid-template-columns:2fr 1fr 3fr"><b>${esc(x.subject||'ללא נושא')}</b><small>${esc(x.email||'אורח')}</small><p>${esc(x.body)}</p></div>`).join('')||'<div class=panel>אין פניות</div>';$('#exportContacts').onclick=()=>download('contacts.json',JSON.stringify(d.contacts,null,2))}document.querySelectorAll('.password-eye').forEach(b=>b.onclick=()=>{let i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'});$('#loginForm').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});csrf=d.csrf;boot()}catch(x){$('#loginError').textContent=x.message}};document.querySelector('.nav').onclick=e=>{let b=e.target.closest('[data-view]');if(b)go(b.dataset.view)};document.body.onclick=e=>{let g=e.target.closest('[data-go]');if(g)go(g.dataset.go)};$('#add').onclick=()=>open();$('#search').onclick=load;$('#q').onkeydown=e=>e.key==='Enter'&&load();$('#cat').onchange=renderList;$('#sort').onchange=renderList;$('#cancel').onclick=()=>$('#editor').close();$('#preview').onclick=()=>{let u=$('#id').value||$('#title').value;window.open('/?title='+encodeURIComponent(u),'_blank')};$('#list').onclick=async e=>{let c=e.target.closest('[data-check]');if(c){c.checked?selected.add(c.dataset.check):selected.delete(c.dataset.check);return}let b=e.target.closest('[data-edit],[data-del],[data-preview]');if(!b)return;let x=items[+(b.dataset.edit??b.dataset.preview)];if(b.dataset.preview!=null)return window.open('/?title='+encodeURIComponent(x.custom_slug||x.id),'_blank');if(b.dataset.edit!=null)return open(x);if(confirm('למחוק?')){await api('/api/admin/item',{method:'DELETE',body:JSON.stringify({id:b.dataset.del})});refresh()}};$('#editForm').onsubmit=async e=>{e.preventDefault();let item={};for(const k of ['id','title','category','year','type','series_name','season_number','episode_number','tmdb_id','description','thumbnail_url','video_url']){let v=$('#'+k).value;item[k]=['year','season_number','episode_number','tmdb_id'].includes(k)&&v?+v:v||null}await api('/api/admin/item',{method:'POST',body:JSON.stringify({item})});$('#editor').close();refresh()};$('#selectAll').onclick=()=>{filtered().forEach(x=>selected.add(x.id));renderList()};$('#bulkDelete').onclick=async()=>{if(selected.size&&confirm(`למחוק ${selected.size} פריטים?`)){await api('/api/admin/bulk',{method:'POST',body:JSON.stringify({action:'delete',ids:[...selected]})});selected.clear();refresh()}};$('#bulkCat').onclick=async()=>{let v=prompt('קטגוריה חדשה');if(v&&selected.size){await api('/api/admin/bulk',{method:'POST',body:JSON.stringify({action:'category',ids:[...selected],value:v})});refresh()}};$('#duplicate').onclick=async()=>{let x=items.find(x=>selected.has(x.id));if(x){x={...x,id:null,title:x.title+' (עותק)'};open(x)}};$('#exportAll').onclick=()=>download('ariel-catalog.json',JSON.stringify(items,null,2));$('#csv').onclick=()=>download('catalog.csv','title,category,year\n'+filtered().map(x=>`"${(x.title||'').replaceAll('"','""')}","${x.category||''}","${x.year||''}"`).join('\n'),'text/csv');$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{let j=JSON.parse(await e.target.files[0].text());let d=await api('/api/admin/import',{method:'POST',body:JSON.stringify({items:j})});alert(`יובאו ${d.count}`);refresh()};$('#newFolder').onclick=async()=>{await api('/api/admin/folders',{method:'POST',body:JSON.stringify({name:$('#folderName').value})});refresh()};$('#folders').onclick=async e=>{let b=e.target.closest('[data-folder-del]');if(b&&confirm('למחוק את התיקייה? הקבצים יועברו ללא תיקייה.')){await api('/api/admin/folders',{method:'DELETE',body:JSON.stringify({name:b.dataset.folderDel})});refresh()}};$('#assetFile').onchange=async e=>{let f=e.target.files[0];if(f.size>1e6)return alert('קובץ עד 1MB');let data=await new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(f)});await api('/api/admin/assets',{method:'POST',body:JSON.stringify({name:f.name,folder:$('#assetFolder').value,data})});refresh()};$('#assetsGrid').onclick=async e=>{let b=e.target.closest('[data-copy],[data-asset-del]');if(!b)return;if(b.dataset.copy)navigator.clipboard.writeText(location.origin+'/asset/'+b.dataset.copy);else{await api('/api/admin/assets',{method:'DELETE',body:JSON.stringify({id:b.dataset.assetDel})});refresh()}};$('#loadContacts').onclick=loadContacts;$('#missingVideo').onclick=()=>{go('catalog');renderList(items.filter(x=>!x.video_url&&!x.video_id))};$('#missingPoster').onclick=()=>{go('catalog');renderList(items.filter(x=>!x.thumbnail_url))};$('#badYear').onclick=()=>{go('catalog');renderList(items.filter(x=>x.year&&(+x.year<1900||+x.year>2100)))};$('#duplicateTitles').onclick=()=>{let c={};items.forEach(x=>c[x.title]=(c[x.title]||0)+1);go('catalog');renderList(items.filter(x=>c[x.title]>1))};$('#checkLinks').onclick=()=>alert('בדיקת מדגם קישורים תרוץ ברקע בגרסה הבאה');$('#clearFilters').onclick=()=>{go('catalog');renderList()};$('#saveSettings').onclick=async()=>{let settings={siteTitle:$('#siteTitle').value,defaultLang:$('#defaultLang').value,accent:$('#accent').value,rowSize:+$('#rowSize').value,autoplay:$('#autoplay').checked,registration:$('#registration').checked,maintenance:$('#maintenance').checked};await api('/api/admin/settings',{method:'POST',body:JSON.stringify({settings})});alert('נשמר')};boot();
</script></body></html>
