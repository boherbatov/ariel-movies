<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071016"><meta name="description" content="ספריית אריאל גולן מוביס לצפייה ישירה, בחיפוש מהיר ובעיצוב שמותאם לנייד.">
<title>אריאל גולן מוביס</title>
<style>
:root{--bg:#071016;--panel:#0d1a23;--panel2:#132530;--text:#f7fbfd;--muted:#8fa4b1;--teal:#36d6ad;--teal2:#1ba886;--line:rgba(255,255,255,.09);--danger:#ff5a6a}*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif;scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% -10%,#153c46 0,transparent 36%),var(--bg)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:66px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(7,16,22,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;margin-left:auto}.mark{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--teal),#62f0cf);color:#042019;font-size:17px;box-shadow:0 0 22px rgba(54,214,173,.25)}.brand b{font-size:18px;letter-spacing:.2px}.brand small{display:block;color:var(--teal);font-size:9px;letter-spacing:2.5px;margin-top:1px}.count{color:var(--muted);font-size:12px;white-space:nowrap}.refresh{border:1px solid var(--line);background:var(--panel);color:white;width:38px;height:38px;border-radius:12px}.hero{padding:42px 18px 24px;max-width:1240px;margin:auto}.eyebrow{color:var(--teal);font-weight:800;font-size:12px;letter-spacing:2px;margin:0 0 10px}.hero h1{font-size:clamp(31px,7vw,58px);line-height:.98;max-width:700px;margin:0 0 14px;letter-spacing:-1.5px}.hero p{color:var(--muted);line-height:1.7;margin:0;max-width:620px}.tools{max-width:1240px;margin:auto;padding:0 18px 20px;position:sticky;top:66px;z-index:15;background:linear-gradient(var(--bg) 70%,transparent)}.search{position:relative}.search span{position:absolute;right:16px;top:13px;color:var(--muted);font-size:21px}.search input{width:100%;height:50px;border-radius:15px;border:1px solid var(--line);background:rgba(19,37,48,.95);color:white;padding:0 48px 0 15px;outline:0;font-size:16px}.search input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(54,214,173,.13)}.chips{display:flex;gap:8px;overflow:auto;padding:12px 1px 2px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--panel);color:#c8d5db;border-radius:999px;padding:9px 15px;white-space:nowrap}.chip.active{background:var(--teal);border-color:var(--teal);color:#032118;font-weight:800}.content{max-width:1240px;margin:auto;padding:0 18px 60px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:12px 0 14px}.section-head h2{font-size:22px;margin:0}.section-head span{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{position:relative;min-width:0;border-radius:16px;overflow:hidden;background:var(--panel);border:1px solid var(--line);text-align:right;color:white;padding:0;transition:.18s transform,.18s border-color}.card:active{transform:scale(.98)}.poster{aspect-ratio:2/3;background:linear-gradient(145deg,#152b37,#0b1820);position:relative;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s transform}.card:hover .poster img{transform:scale(1.035)}.poster:after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.82))}.playdot{position:absolute;bottom:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#042018;font-size:13px;box-shadow:0 5px 16px #0008}.fallback{height:100%;display:grid;place-items:center;font-size:34px;color:var(--teal)}.meta{padding:11px 11px 13px}.title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{display:flex;gap:7px;color:var(--muted);font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden}.empty,.error,.loading{padding:60px 20px;text-align:center;color:var(--muted)}.spinner{display:inline-block;width:30px;height:30px;border:3px solid #ffffff1f;border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}@keyframes spin{to{transform:rotate(360deg)}}.more{display:block;margin:24px auto 0;background:var(--panel2);color:white;border:1px solid var(--line);padding:12px 24px;border-radius:13px}.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,7,10,.82);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#0b171f;width:100%;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);box-shadow:0 -30px 80px #000a;position:relative}.close{position:sticky;float:left;top:12px;margin:12px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid #ffffff22;background:#061018cc;color:white;font-size:24px}.detail{display:grid;padding:0 18px 26px;clear:both}.detail-img{width:min(46vw,210px);aspect-ratio:2/3;border-radius:18px;object-fit:cover;background:var(--panel2);box-shadow:0 18px 55px #0008;margin:-18px 0 18px}.detail h2{font-size:28px;line-height:1.1;margin:0 0 8px}.detail .facts{color:var(--teal);font-size:13px;font-weight:bold}.detail p{color:#b5c4cb;line-height:1.65;font-size:14px}.watch{border:0;border-radius:14px;background:var(--teal);color:#032118;font-weight:900;padding:14px 22px;min-height:50px}.episodes{margin-top:20px}.episodes h3{margin:0 0 10px}.ep{width:100%;text-align:right;border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:12px;margin:5px 0}.ep small{color:var(--muted);display:block;margin-top:3px}.player{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}.playerbar{height:58px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#070b0e}.playerbar button{background:#18232a;color:white;border:0;border-radius:10px;width:38px;height:38px;font-size:23px}.playerbar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player video,.player iframe{width:100%;flex:1;border:0;background:#000;object-fit:contain}.playererror{margin:auto;color:#ddd;text-align:center;padding:30px}.playererror a{color:var(--teal)}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hero,.tools,.content{padding-left:28px;padding-right:28px}.overlay{align-items:center}.sheet{max-width:850px;border-radius:24px;max-height:88vh}.detail{grid-template-columns:220px 1fr;gap:28px}.detail-img{width:220px;margin:0}.detail-copy{padding-top:10px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.hero{padding-top:65px}.card{border-radius:18px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark">▶</span><span><b>אריאל גולן מוביס</b><small>STREAM</small></span></div><span id="total" class="count">טוען ספרייה…</span><button class="refresh" id="refresh" title="רענון">↻</button></header>
<section class="hero"><p class="eyebrow">הספרייה של אריאל גולן מוביס</p><h1>מה בא לך לראות?</h1><p>סרטים, סדרות ותוכן לכל המשפחה במקום אחד. חיפוש מהיר וצפייה ישירה, מותאם במיוחד לנייד.</p></section>
<section class="tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="חיפוש לפי שם, סדרה או תיאור" autocomplete="off"></label><div id="chips" class="chips"></div></section>
<main class="content"><div class="section-head"><h2 id="heading">כל התוכן</h2><span id="shown"></span></div><div id="loading" class="loading"><span class="spinner"></span><div>טוען את הקטלוג…</div><small>זה עשוי לקחת כמה שניות בפעם הראשונה</small></div><div id="grid" class="grid"></div><button id="more" class="more hidden">להציג עוד</button><div id="empty" class="empty hidden">לא מצאנו משהו שמתאים לחיפוש.</div></main>
<div id="overlay" class="overlay hidden" aria-modal="true" role="dialog"><section class="sheet"><button class="close" id="close">×</button><div id="detail" class="detail"></div></section></div>
<div id="player" class="player hidden"><div class="playerbar"><button id="playerClose">×</button><b id="playerTitle"></b></div><div id="playerMount" style="display:flex;flex:1;min-height:0"></div></div>
<script>
const CATALOG='/api/catalog';
let all=[],filtered=[],selectedCategory='הכול',limit=60,active=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function label(item){return item.series_name||item.title||'ללא שם'}
function normalize(items){return items.filter(x=>x&&x.title&&!x.is_live).map((x,i)=>({...x,_i:i,_search:[x.title,x.series_name,x.episode_title,x.description,x.category,x.en_title].filter(Boolean).join(' ').toLowerCase()}))}
async function load(){try{let r=await fetch(CATALOG+'?v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);all=normalize(await r.json());$('#total').textContent=all.length.toLocaleString('he-IL')+' פריטים';makeChips();apply()}catch(e){$('#loading').innerHTML='<div style="color:var(--danger)">לא הצלחנו לטעון את הספרייה.</div><small>'+esc(e.message)+'</small>'}}
function makeChips(){let counts={};all.forEach(x=>counts[x.category||'אחר']=(counts[x.category||'אחר']||0)+1);let cats=Object.entries(counts).sort((a,b)=>b[1]-a[1]);$('#chips').innerHTML=[['הכול',all.length],...cats].map(([c,n])=>`<button class="chip ${c==='הכול'?'active':''}" data-cat="${esc(c)}">${esc(c)} <small>${n.toLocaleString('he-IL')}</small></button>`).join('');$('#chips').onclick=e=>{let b=e.target.closest('.chip');if(!b)return;selectedCategory=b.dataset.cat;limit=60;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));apply()}}
function apply(){let q=$('#search').value.trim().toLowerCase();filtered=all.filter(x=>(selectedCategory==='הכול'||(x.category||'אחר')===selectedCategory)&&(!q||x._search.includes(q)));$('#heading').textContent=q?'תוצאות חיפוש':selectedCategory==='הכול'?'כל התוכן':selectedCategory;render()}
function render(){let slice=filtered.slice(0,limit);$('#loading').classList.add('hidden');$('#empty').classList.toggle('hidden',filtered.length>0);$('#shown').textContent=filtered.length.toLocaleString('he-IL')+' תוצאות';$('#grid').innerHTML=slice.map(card).join('');$('#more').classList.toggle('hidden',slice.length>=filtered.length)}
function card(x){let t=label(x),sub=x.series_name?`עונה ${x.season_number||1} · פרק ${x.episode_number||''}`:[x.year,x.category].filter(Boolean).join(' · ');return `<button class="card" data-i="${x._i}"><div class="poster">${x.thumbnail_url?`<img loading="lazy" src="${esc(x.thumbnail_url)}" alt="${esc(t)}" onerror="this.remove();this.parentNode.insertAdjacentHTML('afterbegin','<div class=fallback>▶</div>')">`:'<div class="fallback">▶</div>'}<span class="playdot">▶</span></div><div class="meta"><div class="title">${esc(t)}</div><div class="sub">${esc(sub)}</div></div></button>`}
$('#grid').onclick=e=>{let c=e.target.closest('.card');if(c)openDetail(all[+c.dataset.i])};
function openDetail(x){active=x;let series=x.series_name?all.filter(y=>y.series_name===x.series_name).sort((a,b)=>(a.season_number||1)-(b.season_number||1)||(a.episode_number||0)-(b.episode_number||0)):[];let eps=series.length?`<div class="episodes"><h3>פרקים (${series.length})</h3>${series.slice(0,250).map(y=>`<button class="ep" data-i="${y._i}">עונה ${y.season_number||1}, פרק ${y.episode_number||''}${y.episode_number_end?'–'+y.episode_number_end:''}<small>${esc(y.episode_title||y.title||'')}</small></button>`).join('')}</div>`:'';$('#detail').innerHTML=`<div>${x.thumbnail_url?`<img class="detail-img" src="${esc(x.thumbnail_url)}" alt="${esc(label(x))}">`:''}</div><div class="detail-copy"><h2>${esc(label(x))}</h2><div class="facts">${esc([x.year,x.category,x.series_name&&`עונה ${x.season_number||1}`].filter(Boolean).join(' · '))}</div>${x.description?`<p>${esc(x.description)}</p>`:''}<button class="watch" data-watch="${x._i}">▶ צפייה עכשיו</button>${eps}</div>`;$('#overlay').classList.remove('hidden');document.body.style.overflow='hidden'}
$('#detail').onclick=e=>{let w=e.target.closest('[data-watch]'),ep=e.target.closest('.ep');if(w)play(all[+w.dataset.watch]);if(ep)play(all[+ep.dataset.i])};
function closeDetail(){ $('#overlay').classList.add('hidden');if($('#player').classList.contains('hidden'))document.body.style.overflow=''}
$('#close').onclick=closeDetail;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeDetail()};
function embedUrl(x){let u=x.video_url||x.video_id||'',type=x.type||'';let m;if((type==='youtube'||u.includes('youtu'))&&(m=u.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{6,})/)))return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&playsinline=1';if((type==='drive'||u.includes('drive.google'))&&(m=u.match(/\/d\/([^/]+)/)))return 'https://drive.google.com/file/d/'+m[1]+'/preview';return null}
function play(x){let u=x.video_url||x.video_id||'',embed=embedUrl(x);$('#playerTitle').textContent=label(x);$('#playerMount').innerHTML=embed?`<iframe src="${esc(embed)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`:u?`<video src="${esc(u)}" controls autoplay playsinline preload="metadata"></video>`:`<div class="playererror">אין קישור צפייה זמין.</div>`;$('#player').classList.remove('hidden');$('#overlay').classList.add('hidden');document.body.style.overflow='hidden';let v=$('#playerMount video');if(v)v.onerror=()=>{$('#playerMount').innerHTML=`<div class="playererror">הנגן לא הצליח לפתוח את הקישור הזה.<br><br><a href="${esc(u)}" target="_blank" rel="noreferrer">פתיחה בחלון חדש</a></div>`}}
function closePlayer(){let v=$('#playerMount video');if(v)v.pause();$('#playerMount').innerHTML='';$('#player').classList.add('hidden');document.body.style.overflow=''}
$('#playerClose').onclick=closePlayer;$('#more').onclick=()=>{limit+=60;render()};$('#search').oninput=()=>{limit=60;apply()};$('#refresh').onclick=()=>location.reload();document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#player').classList.contains('hidden'))closePlayer();else closeDetail()}});load();
</script>
</body></html>
