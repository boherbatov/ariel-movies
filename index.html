const CATALOG='/api/catalog', STORE='arielMoviesStateV2';
firebase.initializeApp({apiKey:'AIzaSyABdwEcHArDLHBpxj1OQWeiKc4mwb4EBw0',authDomain:'ariel-movies.firebaseapp.com',projectId:'ariel-movies',storageBucket:'ariel-movies.firebasestorage.app',messagingSenderId:'848876824638',appId:'1:848876824638:web:9d7781b9b2c302d0f6c96f'});const auth=firebase.auth();let currentUser=null;

let all=[],filtered=[],selectedCategory='הכול',limit=60,active=null,playing=null,state=JSON.parse(localStorage.getItem(STORE)||'{"progress":{},"watchlist":[],"watched":{}}');state.downloads=state.downloads||[];state.settings=Object.assign({language:'he',theme:'dark',autoplay:true,speed:'1',subtitles:true,resume:true},state.settings||{});
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const save=()=>localStorage.setItem(STORE,JSON.stringify(state)), label=x=>state.settings.language==='en'?(x.en_title||x.series_name||x.title||'Untitled'):state.settings.language==='ar'?(x.ar_title||x.en_title||x.series_name||x.title||'بدون عنوان'):(x.series_name||x.title||'ללא שם'), key=x=>x.id||x.custom_slug||x.title;
function normalize(items){return items.filter(x=>x&&x.title&&!x.is_live).map((x,i)=>({...x,_i:i,_search:[x.title,x.series_name,x.episode_title,x.description,x.category,x.en_title].filter(Boolean).join(' ').toLowerCase()}))}
async function load(){try{let r=await fetch(CATALOG+'?v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);all=normalize(await r.json());makeChips();makeShelves();apply();openFromUrl()}catch(e){$('#loading').innerHTML='<div style="color:var(--danger)">לא הצלחנו לטעון את הספרייה.</div><small>'+esc(e.message)+'</small>'}}
function makeChips(){let counts={};all.forEach(x=>counts[x.category||'אחר']=(counts[x.category||'אחר']||0)+1);let cats=Object.entries(counts).sort((a,b)=>b[1]-a[1]),icons={'הכול':'⌂','סדרות':'▤','סדרות ישראליות':'🇮🇱','סדרות לילדים':'★','אנימה':'✦','סדרות טורקיות':'☾','סרטים':'▶','סרטים לילדים (מתאים גם למשפחה)':'☺','אימה':'☠','סרטים ישראלים':'🎬','מארוול':'⚡'};let genres=[['הכול',all.length],...cats].map(([c,n])=>`<button class="chip ${c==='הכול'?'active':''}" data-cat="${esc(c)}"><i>${icons[c]||'◆'}</i><strong>${esc(c==='סרטים לילדים (מתאים גם למשפחה)'?'סרטים לילדים':c)}</strong></button>`).join(''),quick=`<button class="chip" data-quick="new"><i>✦</i><strong>חדש השבוע</strong></button><button class="chip" data-quick="history"><i>◷</i><strong>היסטוריה</strong></button><button class="chip" data-quick="continue"><i>▶</i><strong>המשך צפייה</strong></button><button class="chip" data-quick="watchlist"><i>♥</i><strong>מועדפים</strong></button>`;$('#chips').innerHTML=genres+quick;document.querySelectorAll('#chips').forEach(row=>row.onclick=e=>{let b=e.target.closest('.chip');if(!b)return;if(b.dataset.quick){if(['history','continue','watchlist'].includes(b.dataset.quick))return goPersonal(b.dataset.quick==='watchlist'?'favorites':b.dataset.quick);if(b.dataset.quick==='new'){scrollTo({top:$('#featured').offsetTop-120,behavior:'smooth'});return}openDrawer();panel(b.dataset.quick);return}selectedCategory=b.dataset.cat;limit=60;document.querySelectorAll('.chip[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===selectedCategory));makeShelves();apply()})}
function miniCard(x,extra=''){return `<button class="mini" data-i="${x._i}"><div>${x.thumbnail_url?`<img src="${esc(x.thumbnail_url)}" alt="">`:'▶'}${extra}</div><b>${esc(label(x))}</b></button>`}
function shelf(title,items,extras,wide=false,category=''){let u=category?'/?category='+encodeURIComponent(category):'';return items.length?`<section class="shelf ${wide?'wide-rail':''}"><h2>${u?`<a href="${u}">${title}</a>`:title}</h2><div class="rail">${items.map((x,i)=>miniCard(x,extras&&extras(x,i))).join('')}${u?`<a class="show-all" href="${u}">הצג הכל</a>`:''}</div></section>`:''}
let featureIndex=0,featureTimer=null;function renderFeatured(items){let box=$('#featured');if(selectedCategory!=='הכול'||$('#search').value.trim()||!items.length){box.innerHTML='';return}featureIndex=Math.min(featureIndex,items.length-1);box.innerHTML=`<section class="featured">${items.map((x,i)=>`<article class="featured-slide ${i===featureIndex?'active':''}" data-fi="${i}"><img src="${esc(x.backdrop_url||x.thumbnail_url||'')}" alt=""><div class="featured-copy"><h2>${esc(label(x))}</h2><div class="featured-actions"><button class="featured-watch" data-feature-watch="${x._i}">▶ צפה</button><button class="featured-info" data-feature-info="${x._i}">ⓘ מידע נוסף</button></div></div></article>`).join('')}<div class="featured-dots">${items.map((x,i)=>`<button class="${i===featureIndex?'active':''}" data-feature-dot="${i}" aria-label="${i+1}"></button>`).join('')}</div></section>`;let startX=0;box.ontouchstart=e=>startX=e.touches[0].clientX;box.ontouchend=e=>{let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)setFeature(featureIndex+(d<0?1:-1),items)};box.onclick=e=>{let w=e.target.closest('[data-feature-watch]'),n=e.target.closest('[data-feature-info]'),d=e.target.closest('[data-feature-dot]');if(w)play(all[+w.dataset.featureWatch]);if(n)openDetail(all[+n.dataset.featureInfo]);if(d)setFeature(+d.dataset.featureDot,items)};clearInterval(featureTimer);featureTimer=setInterval(()=>setFeature(featureIndex+1,items),6500)}function setFeature(i,items){featureIndex=(i+items.length)%items.length;document.querySelectorAll('.featured-slide').forEach((x,n)=>x.classList.toggle('active',n===featureIndex));document.querySelectorAll('[data-feature-dot]').forEach((x,n)=>x.classList.toggle('active',n===featureIndex))}
function makeShelves(){let list=all.filter(x=>state.watchlist.includes(key(x))).slice(0,15),fresh=[...all].sort((a,b)=>new Date(b.created_date||b.added_at||0)-new Date(a.created_date||a.added_at||0)).slice(0,15),popular=[...all].filter(x=>state.watched[key(x)]).sort((a,b)=>(state.watched[key(b)]||0)-(state.watched[key(a)]||0)).slice(0,15),html='';renderFeatured(fresh.slice(0,6));if(selectedCategory==='הכול'){html=shelf('הרשימה שלי',list)+shelf('הנצפים ביותר אצלך',popular);let cats=[...new Set(all.map(x=>x.category||'אחר'))];html+=cats.map(c=>shelf(c==='סרטים לילדים (מתאים גם למשפחה)'?'סרטים לילדים':c,all.filter(x=>(x.category||'אחר')===c).slice(0,24),null,false,c)).join('')}$('#shelves').innerHTML=html;$('#shelves').onclick=e=>{let c=e.target.closest('[data-i]');if(c)openDetail(all[+c.dataset.i])}}
const PERSONAL_ROUTES={favorites:'watchlist',continue:'continue',history:'history'},PERSONAL_LABELS={favorites:'מועדפים',continue:'המשך צפייה',history:'היסטוריה'};function personalRoute(){return location.pathname.slice(1)}function personalItems(r){if(r==='favorites')return all.filter(x=>state.watchlist.includes(key(x)));if(r==='continue')return all.filter(x=>state.progress[key(x)]?.time>10);if(r==='history')return Object.keys(state.watched).sort((a,b)=>(state.progress[b]?.seen||0)-(state.progress[a]?.seen||0)).map(k=>all.find(x=>key(x)===k)).filter(Boolean);return null}function goPersonal(r){location.href='/'+r}
function apply(){let q=$('#search').value.trim().toLowerCase(),r=personalRoute(),pi=personalItems(r);filtered=pi||all.filter(x=>(selectedCategory==='הכול'||(x.category||'אחר')===selectedCategory)&&(!q||x._search.includes(q)));$('#heading').textContent=pi?PERSONAL_LABELS[r]:q?'תוצאות חיפוש':selectedCategory==='הכול'?'כל התוכן':selectedCategory;if(pi){$('#featured').innerHTML='';$('#shelves').innerHTML=''}render()}
function render(){let home=!personalItems(personalRoute())&&selectedCategory==='הכול'&&!$('#search').value.trim(),slice=filtered.slice(0,limit);$('#loading').classList.add('hidden');$('.section-head').classList.toggle('hidden',home);$('#grid').classList.toggle('hidden',home);$('#empty').classList.toggle('hidden',home||filtered.length>0);$('#shown').textContent=filtered.length.toLocaleString('he-IL')+' תוצאות';$('#grid').innerHTML=home?'':slice.map(card).join('');$('#more').classList.toggle('hidden',home||slice.length>=filtered.length);scheduleVisibleLocalization()}
function card(x){let t=label(x),sub=x.series_name?`עונה ${x.season_number||1} · פרק ${x.episode_number||''}`:[x.year,x.category].filter(Boolean).join(' · ');return `<button class="card" data-i="${x._i}"><div class="poster">${x.thumbnail_url?`<img loading="lazy" src="${esc(x.thumbnail_url)}" alt="${esc(t)}" onerror="this.remove()">`:'<div class="fallback">▶</div>'}<span class="playdot">▶</span></div><div class="meta"><div class="title">${esc(t)}</div><div class="sub">${esc(sub)}</div></div></button>`}
$('#grid').onclick=e=>{let c=e.target.closest('.card');if(c)openDetail(all[+c.dataset.i])};
async function localizeTitle(x){let l=state.settings.language;if(l==='he'||x[l==='en'?'en_title':'ar_title'])return;try{let r=await fetch('/api/localize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:x.id||x.custom_slug,lang:l})}),d=await r.json();if(r.ok&&d.title){x[l==='en'?'en_title':'ar_title']=d.title;if(active===x){let h=$('#detail h2');if(h)h.textContent=label(x);$('#playerTitle').textContent=playing===x?label(x):$('#playerTitle').textContent}makeShelves();render()}}catch(e){}}
let localizedVisible=new Set(),localizeTimer=null,localizeBusy=false;function scheduleVisibleLocalization(){let l=state.settings.language;if(l==='he')return;clearTimeout(localizeTimer);localizeTimer=setTimeout(async()=>{if(localizeBusy)return;let visible=[...document.querySelectorAll('[data-i]')].filter(el=>{let r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight+500}).map(el=>all[+el.dataset.i]).filter(Boolean),batch=[];for(let x of visible){let id=String(x.id||x.custom_slug||'');if(id&&!localizedVisible.has(l+':'+id)&&!(l==='en'&&x.en_title)&&!(l==='ar'&&x.ar_title)){localizedVisible.add(l+':'+id);batch.push(id);if(batch.length===12)break}}if(!batch.length)return;localizeBusy=true;try{let r=await fetch('/api/localize-batch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids:batch,lang:l})}),d=await r.json();Object.entries(d.results||{}).forEach(([id,v])=>{let x=all.find(x=>String(x.id||x.custom_slug)===id);if(x&&v.title)x[l==='en'?'en_title':'ar_title']=v.title});makeShelves();render()}catch(e){}finally{localizeBusy=false;setTimeout(scheduleVisibleLocalization,1200)}},350)}addEventListener('scroll',scheduleVisibleLocalization,{passive:true});
function openDetail(x,push=true){active=x;localizeTitle(x);let series=x.series_name?all.filter(y=>y.series_name===x.series_name).sort((a,b)=>(a.season_number||1)-(b.season_number||1)||(a.episode_number||0)-(b.episode_number||0)):[],seasons=[...new Set(series.map(y=>y.season_number||1))],slug=x.custom_slug||x.id;let eps=series.length?`<div class="episodes"><h3>עונות ופרקים</h3><div class="season-tabs">${seasons.map(s=>`<button data-season="${s}" class="season ${s===(x.season_number||1)?'active':''}">עונה ${s}</button>`).join('')}</div><div id="episodeList">${episodeHtml(series,x.season_number||seasons[0])}</div></div>`:'';let inList=state.watchlist.includes(key(x));$('#detail').innerHTML=`<div>${x.thumbnail_url?`<img class="detail-img" src="${esc(x.thumbnail_url)}" alt="${esc(label(x))}">`:''}</div><div class="detail-copy"><h2>${esc(label(x))}</h2><div class="facts">${esc([x.year,x.category,x.series_name&&`עונה ${x.season_number||1}`].filter(Boolean).join(' · '))}</div>${x.description?`<p>${esc(x.description)}</p>`:''}<div class="actions"><button class="watch" data-watch="${x._i}">▶ ${state.progress[key(x)]?'המשך צפייה':'צפייה עכשיו'}</button><button class="secondary" data-list>${inList?'✓ ברשימה שלי':'+ לצפייה מאוחר יותר'}</button><button class="secondary" data-share>שיתוף</button></div><div id="tmdbMore"></div>${eps}<div id="recommend"></div></div>`;$('#overlay').classList.remove('hidden');document.body.style.overflow='hidden';if(push)history.replaceState(null,'','?title='+encodeURIComponent(slug));if(x.tmdb_id)loadTmdb(x.tmdb_id);renderRecommendations(x)}
function episodeHtml(series,season){return series.filter(y=>(y.season_number||1)==season).map(y=>`<button class="ep" data-i="${y._i}">פרק ${y.episode_number||''}${y.episode_number_end?'–'+y.episode_number_end:''}<small>${esc(y.episode_title||y.title||'')}</small></button>`).join('')}
async function loadTmdb(id){try{let r=await fetch('/api/tmdb/title/'+id);if(!r.ok)return;let d=await r.json(),box=$('#tmdbMore');if(!box)return;box.innerHTML=`<div class="tmdb"><div class="facts">⭐ ${d.rating?Number(d.rating).toFixed(1):'—'} · ${esc(d.genres?.join(' · ')||'')} ${d.runtime?' · '+d.runtime+' דקות':''}</div>${d.overview&&!active.description?`<p>${esc(d.overview)}</p>`:''}${d.trailer?`<div class="trailer"><iframe src="https://www.youtube-nocookie.com/embed/${esc(d.trailer)}" title="טריילר" allowfullscreen></iframe></div>`:''}</div>${d.cast?.length?`<div class="cast"><h3>שחקנים</h3><div class="castrow">${d.cast.map(p=>`<button class="person" data-person="${p.id}">${p.profile?`<img src="${esc(p.profile)}" alt="${esc(p.name)}">`:'<div class="noimg">🎭</div>'}<b>${esc(p.name)}</b><small>${esc(p.character||'')}</small></button>`).join('')}</div></div>`:''}`}catch(e){}}
async function openPerson(id){$('#overlay').classList.remove('hidden');document.body.style.overflow='hidden';$('#detail').innerHTML='<div class=loading><span class=spinner></span><div>טוען עמוד שחקן…</div></div>';let r=await fetch('/api/tmdb/person/'+id);if(!r.ok)return;let d=await r.json(),ids=new Set(d.credits||[]),matches=all.filter(x=>ids.has(Number(x.tmdb_id)));$('#detail').innerHTML=`<div>${d.profile?`<img class="detail-img" src="${esc(d.profile)}">`:''}</div><div class="detail-copy"><h2>${esc(d.name)}</h2><div class="facts">${esc(d.knownFor||'')}</div>${d.biography?`<p>${esc(d.biography)}</p>`:''}<div class="actor-grid">${matches.length?matches.map(card).join(''):'<p>אין כרגע כותרים נוספים של השחקן במאגר.</p>'}</div></div>`;history.replaceState(null,'','?actor='+id)}
function renderRecommendations(x){let rec=all.filter(y=>y!==x&&(y.category===x.category||y.series_name===x.series_name)).slice(0,12);$('#recommend').innerHTML=shelf('כי צפית ב'+esc(label(x)),rec)}
function openFromUrl(){let q=new URLSearchParams(location.search),s=q.get('title'),a=q.get('actor');if(a)return openPerson(a);if(s){let x=all.find(y=>y.id===s||y.custom_slug===s);if(x)openDetail(x,false)}}

$('#detail').onclick=e=>{let w=e.target.closest('[data-watch]'),ep=e.target.closest('.ep'),person=e.target.closest('[data-person]'),season=e.target.closest('[data-season]'),c=e.target.closest('.card,.mini');if(w)play(all[+w.dataset.watch]);if(ep||c)play(all[+(ep||c).dataset.i]);if(person)openPerson(person.dataset.person);if(season&&active){document.querySelectorAll('.season').forEach(b=>b.classList.toggle('active',b===season));let s=all.filter(y=>y.series_name===active.series_name);$('#episodeList').innerHTML=episodeHtml(s,+season.dataset.season)}if(e.target.closest('[data-list]')){let k=key(active),i=state.watchlist.indexOf(k);i<0?state.watchlist.push(k):state.watchlist.splice(i,1);save();makeShelves();openDetail(active,false)}if(e.target.closest('[data-share]'))navigator.share?navigator.share({title:label(active),url:location.href}):navigator.clipboard.writeText(location.href)};
