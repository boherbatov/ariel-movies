<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסה עם Google</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><style>body{margin:0;background:#071016;color:white;font-family:Arial;display:grid;place-items:center;min-height:100vh;text-align:center}.box{width:min(88vw,380px);padding:28px;background:#0d1a23;border:1px solid #ffffff18;border-radius:22px}.logo{width:74px;border-radius:16px;background:#fff}button{width:100%;border:0;border-radius:12px;padding:14px;background:#fff;color:#17232a;font-size:17px;font-weight:bold;margin-top:16px}.msg{color:#9db0ba;line-height:1.5}</style></head><body><main class="box"><img class="logo" src="/logo.png"><h1>Ariel Movies 🍿</h1><p class="msg">לחץ כדי לבחור חשבון Google ולהתחבר לאפליקציה</p><button id="go">G&nbsp;&nbsp;המשך עם Google</button></main><script>firebase.initializeApp({apiKey:'AIzaSyABdwEcHArDLHBpxj1OQWeiKc4mwb4EBw0',authDomain:'ariel-movies.firebaseapp.com',projectId:'ariel-movies',appId:'1:848876824638:web:9d7781b9b2c302d0f6c96f'});const msg=document.querySelector('.msg'),go=document.querySelector('#go');go.onclick=async()=>{go.disabled=true;msg.textContent='פותח בחירת חשבון…';try{let p=new firebase.auth.GoogleAuthProvider();p.addScope('profile');p.addScope('email');p.setCustomParameters({prompt:'select_account'});let r=await firebase.auth().signInWithPopup(p),token=r.credential&&r.credential.idToken;if(!token)throw new Error('לא התקבל אסימון התחברות');let deep='arielmovies://auth?id_token='+encodeURIComponent(token);msg.innerHTML='ההתחברות הצליחה. לחץ כדי לחזור לאפליקציה.';go.disabled=false;go.textContent='חזרה ל-Ariel Movies';go.onclick=()=>location.href=deep;location.href=deep}catch(e){msg.textContent=e.message;go.disabled=false}};</script></body></html>
